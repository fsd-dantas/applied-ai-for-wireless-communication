[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisg"
version = "0.11.0"
description = "Research knowledge base and research framework for applying artificial intelligence to wireless communication systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Sabino Dantas", email = "fernando@sdantas.com.br" }]
keywords = ["artificial-intelligence", "expert-system", "strips", "planning", "a-star", "blackboard", "multi-rat", "smart-grid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "ipykernel>=6"]

[project.scripts]
aisg = "aisg.cli:main"

[tool.setuptools.packages.find]
where = ["software"]
include = ["aisg*"]

[tool.setuptools.package-data]
aisg = ["domain/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["software/tests"]
pythonpath = ["software"]
addopts = "-q"
